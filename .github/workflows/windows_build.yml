name: windows-build
on:
  push:
    branches: [ "master", "test-staging" ]
  pull_request:
    branches: [ "master", "test-staging" ]

concurrency:
  group: "windows-build-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    env:
      BOOST_ROOT: C:\local\boost_1_82_0
    steps:
      - name: Setup Short Paths
        shell: bash
        run: |
          git config --global core.longpaths true
      - name: Checkout AzerothCore
        uses: actions/checkout@v3
        with:
          repository: 'mod-playerbots/azerothcore-wotlk'
          ref: ${{ (github.base_ref || github.ref_name) == 'test-staging' && 'test-staging' || 'Playerbot' }}
          path: 'e'
      - name: Checkout Playerbot Module
        uses: actions/checkout@v3
        with:
          repository: 'mod-playerbots/mod-playerbots'
          #path: 'modules/mod-playerbots'
          path: e/modules/mod-playerbots
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.13
      - name: Configure OS
        shell: bash
        working-directory: e
        env:
          CONTINUOUS_INTEGRATION: true
        run: |
          ./acore.sh install-deps
      - name: Build
        shell: bash
        working-directory: e
        run: |
          export CTOOLS_BUILD=all
          ./acore.sh compiler build
